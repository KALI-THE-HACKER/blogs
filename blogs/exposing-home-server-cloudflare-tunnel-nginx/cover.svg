<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#F3ECE1"/>
  
  <!-- Architectural grid background -->
  <g stroke="#1F1B16" stroke-opacity="0.06" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="500" y1="0" x2="500" y2="675"/>
    <line x1="700" y1="0" x2="700" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1100" y1="0" x2="1100" y2="675"/>
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Visual Network Diagram Motif -->
  <g transform="translate(600, 320)">
    <!-- Edge Node -->
    <circle cx="-320" cy="0" r="48" fill="#FAF6EE" stroke="#B4532A" stroke-width="2"/>
    <text x="-320" y="5" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#B4532A" text-anchor="middle">EDGE</text>
    
    <!-- Tunnel Node -->
    <circle cx="-100" cy="0" r="48" fill="#FAF6EE" stroke="#1F1B16" stroke-opacity="0.4" stroke-width="2"/>
    <text x="-100" y="5" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#1F1B16" text-anchor="middle">TUNNEL</text>
    
    <!-- Proxy Node -->
    <circle cx="120" cy="0" r="48" fill="#FAF6EE" stroke="#2F5D50" stroke-width="2"/>
    <text x="120" y="5" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#2F5D50" text-anchor="middle">NGINX</text>

    <!-- Services Node Cluster -->
    <circle cx="340" cy="-40" r="28" fill="#FAF6EE" stroke="#1F1B16" stroke-opacity="0.3" stroke-width="2"/>
    <text x="340" y="-36" font-family="'JetBrains Mono', monospace" font-size="10" fill="#5E5549" text-anchor="middle">n8n</text>
    
    <circle cx="340" cy="40" r="28" fill="#FAF6EE" stroke="#1F1B16" stroke-opacity="0.3" stroke-width="2"/>
    <text x="340" y="44" font-family="'JetBrains Mono', monospace" font-size="10" fill="#5E5549" text-anchor="middle">nextcloud</text>

    <!-- Connecting Vectors -->
    <path d="M -272 0 L -148 0" stroke="#B4532A" stroke-width="2" stroke-dasharray="6,4"/>
    <path d="M -52 0 L 72 0" stroke="#1F1B16" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M 168 -15 L 312 -40" stroke="#2F5D50" stroke-width="2"/>
    <path d="M 168 15 L 312 40" stroke="#2F5D50" stroke-width="2"/>
  </g>

  <!-- Card Framing and Typography -->
  <rect x="60" y="60" width="1080" height="555" fill="none" stroke="#1F1B16" stroke-opacity="0.12" stroke-width="1"/>
  
  <text x="100" y="120" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#B4532A" letter-spacing="2">INFRASTRUCTURE &amp; SECURITY</text>
  
  <text x="100" y="500" font-family="'Fraunces', Georgia, serif" font-weight="700" font-size="44" fill="#1F1B16" letter-spacing="-1">Exposing a Home Server Safely</text>
  <text x="100" y="555" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="24" fill="#5E5549">Zero open ports with Cloudflare Tunnel, wireguard-backed Nginx, and strict mTLS.</text>
</svg>
