<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#F3ECE1"/>

  <!-- Subtle Blueprint Lines -->
  <g stroke="#1F1B16" stroke-opacity="0.06" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="675"/>
    <line x1="350" y1="0" x2="350" y2="675"/>
    <line x1="550" y1="0" x2="550" y2="675"/>
    <line x1="750" y1="0" x2="750" y2="675"/>
    <line x1="950" y1="0" x2="950" y2="675"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>

  <!-- Graphic Dual Bucket & Key Vector -->
  <g transform="translate(600, 310)">
    <!-- Public Bucket -->
    <rect x="-340" y="-80" width="180" height="160" rx="8" fill="#FAF6EE" stroke="#2F5D50" stroke-width="2"/>
    <text x="-250" y="-30" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#2F5D50" text-anchor="middle">PUBLIC BUCKET</text>
    <text x="-250" y="5" font-family="'Newsreader', serif" font-size="15" fill="#5E5549" text-anchor="middle">Static CDN cache</text>
    <text x="-250" y="40" font-family="'JetBrains Mono', monospace" font-size="11" fill="#847B6F" text-anchor="middle">avatars / css / js</text>

    <!-- App / Auth Node -->
    <circle cx="0" cy="0" r="54" fill="#FAF6EE" stroke="#1F1B16" stroke-width="2"/>
    <text x="0" y="-6" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#1F1B16" text-anchor="middle">DJANGO</text>
    <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#B4532A" text-anchor="middle">HMAC SIGN</text>

    <!-- Protected Bucket -->
    <rect x="160" y="-80" width="180" height="160" rx="8" fill="#FAF6EE" stroke="#B4532A" stroke-width="2"/>
    <text x="250" y="-30" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#B4532A" text-anchor="middle">PRIVATE R2</text>
    <text x="250" y="5" font-family="'Newsreader', serif" font-size="15" fill="#5E5549" text-anchor="middle">Pre-signed URLs</text>
    <text x="250" y="40" font-family="'JetBrains Mono', monospace" font-size="11" fill="#847B6F" text-anchor="middle">contracts / reports</text>

    <!-- Connections -->
    <path d="M -160 0 L -54 0" stroke="#2F5D50" stroke-width="2" stroke-dasharray="4,4"/>
    <path d="M 54 0 L 160 0" stroke="#B4532A" stroke-width="2"/>
  </g>

  <!-- Outer Frame -->
  <rect x="60" y="60" width="1080" height="555" fill="none" stroke="#1F1B16" stroke-opacity="0.12" stroke-width="1"/>

  <text x="100" y="120" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#B4532A" letter-spacing="2">STORAGE &amp; CLOUD ARCHITECTURE</text>

  <text x="100" y="500" font-family="'Fraunces', Georgia, serif" font-weight="700" font-size="44" fill="#1F1B16" letter-spacing="-1">Protected Media with Cloudflare R2</text>
  <text x="100" y="555" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="24" fill="#5E5549">Dual-bucket isolation, temporary S3 pre-signed URLs, and zero egress fees.</text>
</svg>
